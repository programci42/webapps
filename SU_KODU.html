<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematik Oyunu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            height: 100vh;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        #menuScreen, #gameScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        #menuScreen {
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        .menu-title {
            font-size: 4em;
            color: white;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .menu-button {
            padding: 20px 50px;
            font-size: 1.5em;
            background: linear-gradient(45deg, #FF6B6B, #FFE66D);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-weight: bold;
        }

        .menu-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .difficulty-selector {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .difficulty-button {
            padding: 15px 30px;
            font-size: 1.2em;
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .difficulty-button:hover, .difficulty-button.active {
            background: rgba(255,255,255,0.4);
            transform: scale(1.1);
        }

        #gameScreen {
            display: none;
        }

        #gameCanvas {
            display: block;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .game-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 1.5em;
            pointer-events: none;
        }

        .ui-panel {
            background: rgba(0,0,0,0.3);
            padding: 15px 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .score-display, .level-display, .timer-display {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .label {
            font-size: 0.6em;
            opacity: 0.8;
        }

        .value {
            font-size: 1.2em;
            font-weight: bold;
        }

        .target-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.9);
            padding: 20px 40px;
            border-radius: 20px;
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        .control-buttons {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .control-btn {
            padding: 15px 30px;
            font-size: 1em;
            background: rgba(255,255,255,0.3);
            border: 2px solid white;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.5);
            transform: translateY(-3px);
        }

        .particle {
            position: absolute;
            pointer-events: none;
            animation: particle-fade 1s forwards;
        }

        @keyframes particle-fade {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .visible {
            opacity: 1;
            pointer-events: auto;
        }

        #gameOverScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 20;
        }

        .game-over-panel {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .game-over-title {
            font-size: 4em;
            color: #FF6B6B;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .final-score {
            font-size: 2em;
            color: white;
            margin: 20px 0;
        }

        .name-input {
            padding: 15px 30px;
            font-size: 1.5em;
            border: none;
            border-radius: 15px;
            margin: 20px 0;
            text-align: center;
            width: 300px;
        }

        .submit-score-btn {
            padding: 15px 40px;
            font-size: 1.3em;
            background: linear-gradient(45deg, #4CAF50, #8BC34A);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            margin-top: 10px;
        }

        .submit-score-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        #highScoreScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 20;
        }

        .highscore-panel {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 90%;
        }

        .highscore-title {
            font-size: 3em;
            color: #FFD700;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        .highscore-table {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }

        .highscore-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 1.3em;
            transition: all 0.3s ease;
        }

        .highscore-row:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .highscore-rank {
            font-weight: bold;
            color: #FFD700;
            min-width: 50px;
        }

        .highscore-name {
            flex: 1;
            text-align: left;
            margin: 0 20px;
        }

        .highscore-score {
            font-weight: bold;
            color: #4CAF50;
            min-width: 100px;
            text-align: right;
        }

        .crosshair {
            position: absolute;
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 100;
            display: none;
        }

        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .crosshair::before {
            width: 3px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }

        .crosshair::after {
            width: 100%;
            height: 3px;
            top: 50%;
            transform: translateY(-50%);
        }

        .crosshair-center {
            position: absolute;
            width: 8px;
            height: 8px;
            background: red;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px red;
        }

        @media (max-width: 768px) {
            .menu-title {
                font-size: 2.5em;
            }
            
            .menu-button {
                font-size: 1.2em;
                padding: 15px 35px;
            }
            
            .game-ui {
                font-size: 1em;
            }
            
            .target-display {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="menuScreen" class="visible">
            <div class="menu-title">🎯 Matematik Oyunu</div>
            <button class="menu-button" onclick="startGame()">🎮 Oyuna Başla</button>
            
            <div class="difficulty-selector">
                <button class="difficulty-button active" data-difficulty="easy" onclick="selectDifficulty('easy')">
                    😊 Kolay
                </button>
                <button class="difficulty-button" data-difficulty="medium" onclick="selectDifficulty('medium')">
                    😐 Orta
                </button>
                <button class="difficulty-button" data-difficulty="hard" onclick="selectDifficulty('hard')">
                    😤 Zor
                </button>
            </div>
        </div>

        <div id="gameScreen">
            <canvas id="gameCanvas"></canvas>
            
            <div class="crosshair" id="crosshair">
                <div class="crosshair-center"></div>
            </div>
            
            <div class="game-ui">
                <div class="ui-panel">
                    <div class="level-display">
                        <div class="label">SEVİYE</div>
                        <div class="value" id="levelValue">1</div>
                    </div>
                    <div class="score-display">
                        <div class="label">SKOR</div>
                        <div class="value" id="scoreValue">0</div>
                    </div>
                    <div class="timer-display">
                        <div class="label">SÜRE</div>
                        <div class="value" id="timerValue">90</div>
                    </div>
                </div>
            </div>

            <div class="target-display">
                <div style="font-size: 0.5em; opacity: 0.8; margin-bottom: 5px;">
                    🎯 Seviye <span id="targetLevel">1</span>
                </div>
                Hedef: <span id="targetValue">0</span> = [<span id="currentValue">0</span>]
            </div>

            <div class="control-buttons">
                <button class="control-btn" onclick="undoMove()">↶ Geri Al</button>
                <button class="control-btn" onclick="resetLevel()">🔄 Sıfırla</button>
                <button class="control-btn" onclick="returnToMenu()">🏠 Menü</button>
            </div>
        </div>

        <div id="gameOverScreen">
            <div class="game-over-panel">
                <div class="game-over-title">⏰ SÜRE BİTTİ!</div>
                <div class="final-score">
                    Toplam Skor: <span id="finalScore">0</span>
                </div>
                <input type="text" class="name-input" id="playerName" placeholder="İsminizi girin" maxlength="15" onkeypress="if(event.key === 'Enter') submitScore()">
                <br>
                <button class="submit-score-btn" onclick="submitScore()">💾 Kaydet ve Tabloyu Gör</button>
            </div>
        </div>

        <div id="highScoreScreen">
            <div class="highscore-panel">
                <div class="highscore-title">🏆 EN YÜKSEK SKORLAR</div>
                <div class="highscore-table" id="highScoreTable"></div>
                <button class="menu-button" onclick="returnToMenuFromHighScore()" style="margin-top: 20px;">
                    🏠 Ana Menüye Dön
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Ses sistemi
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let backgroundMusic = null;
        
        // Arka plan müziği oluştur
        function createBackgroundMusic() {
            if (backgroundMusic) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(220, audioContext.currentTime);
            gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
            
            // Melodi değişimleri
            const melody = [220, 247, 262, 294, 330, 294, 262, 247];
            let noteIndex = 0;
            
            const playNote = () => {
                if (gameState.isPlaying) {
                    oscillator.frequency.setValueAtTime(melody[noteIndex], audioContext.currentTime);
                    noteIndex = (noteIndex + 1) % melody.length;
                }
            };
            
            oscillator.start();
            backgroundMusic = setInterval(playNote, 800);
        }
        
        // Başarı sesi oluştur
        function playSuccessSound() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(523, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(784, audioContext.currentTime + 0.1);
            oscillator.frequency.exponentialRampToValueAtTime(1047, audioContext.currentTime + 0.2);
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.3);
        }
        
        let gameState = {
            difficulty: 'easy',
            level: 1,
            score: 0,
            targetNumber: 0,
            currentSum: 0,
            isPlaying: false,
            boxes: [],
            dropZone: null,
            draggedBox: null,
            history: [],
            timeLeft: 90,
            timerInterval: null,
            gamepad: {
                connected: false,
                index: -1,
                crosshairX: 0,
                crosshairY: 0,
                buttonPressed: false
            }
        };

        let highScores = JSON.parse(localStorage.getItem('mathGameHighScores')) || [];

        const difficultySettings = {
            easy: { boxCount: 8, range: [1, 20], negativeChance: 0.2, timeLimit: 90 },
            medium: { boxCount: 10, range: [1, 50], negativeChance: 0.3, timeLimit: 60 },
            hard: { boxCount: 12, range: [1, 99], negativeChance: 0.4, timeLimit: 30 }
        };

        function resizeCanvas() {
            canvas.width = window.innerWidth - 40;
            canvas.height = window.innerHeight - 200;
        }

        function selectDifficulty(difficulty) {
            gameState.difficulty = difficulty;
            document.querySelectorAll('.difficulty-button').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.difficulty === difficulty) {
                    btn.classList.add('active');
                }
            });
        }

        function startGame() {
            document.getElementById('menuScreen').classList.remove('visible');
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('gameScreen').style.display = 'flex';
            
            resizeCanvas();
            gameState.isPlaying = true;
            gameState.level = 1;
            gameState.score = 0;
            
            const settings = difficultySettings[gameState.difficulty];
            gameState.timeLeft = settings.timeLimit;
            
            // Müziği başlat
            createBackgroundMusic();
            
            startTimer();
            setupLevel();
            gameLoop();
        }

        function startTimer() {
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
            }
            
            gameState.timerInterval = setInterval(() => {
                if (gameState.isPlaying) {
                    gameState.timeLeft--;
                    document.getElementById('timerValue').textContent = gameState.timeLeft;
                    
                    if (gameState.timeLeft <= 0) {
                        gameOver();
                    }
                    
                    const timerElement = document.getElementById('timerValue');
                    if (gameState.timeLeft <= 10) {
                        timerElement.style.color = '#FF6B6B';
                        timerElement.style.animation = 'pulse 1s infinite';
                    } else {
                        timerElement.style.color = 'white';
                        timerElement.style.animation = 'none';
                    }
                }
            }, 1000);
        }

        function gameOver() {
            gameState.isPlaying = false;
            clearInterval(gameState.timerInterval);
            
            // Müziği durdur
            if (backgroundMusic) {
                clearInterval(backgroundMusic);
                backgroundMusic = null;
            }
            
            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('gameOverScreen').style.display = 'flex';
            document.getElementById('playerName').value = '';
            document.getElementById('playerName').focus();
        }

        function submitScore() {
            const playerName = document.getElementById('playerName').value.trim();
            
            if (!playerName) {
                alert('Lütfen isminizi girin!');
                return;
            }
            
            highScores.push({
                name: playerName,
                score: gameState.score,
                difficulty: gameState.difficulty,
                date: new Date().toLocaleDateString('tr-TR')
            });
            
            highScores.sort((a, b) => b.score - a.score);
            highScores = highScores.slice(0, 10);
            localStorage.setItem('mathGameHighScores', JSON.stringify(highScores));
            
            showHighScores();
        }

        function showHighScores() {
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('highScoreScreen').style.display = 'flex';
            
            const table = document.getElementById('highScoreTable');
            table.innerHTML = '';
            
            if (highScores.length === 0) {
                table.innerHTML = '<div style="color: white; padding: 20px;">Henüz kayıtlı skor yok!</div>';
                return;
            }
            
            highScores.forEach((score, index) => {
                const row = document.createElement('div');
                row.className = 'highscore-row';
                
                const rank = document.createElement('div');
                rank.className = 'highscore-rank';
                rank.textContent = `${index + 1}.`;
                if (index === 0) rank.textContent = '🥇';
                if (index === 1) rank.textContent = '🥈';
                if (index === 2) rank.textContent = '🥉';
                
                const name = document.createElement('div');
                name.className = 'highscore-name';
                name.textContent = score.name;
                
                const scoreValue = document.createElement('div');
                scoreValue.className = 'highscore-score';
                scoreValue.textContent = score.score;
                
                row.appendChild(rank);
                row.appendChild(name);
                row.appendChild(scoreValue);
                
                table.appendChild(row);
            });
        }

        function returnToMenuFromHighScore() {
            document.getElementById('highScoreScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('menuScreen').classList.remove('hidden');
            document.getElementById('menuScreen').classList.add('visible');
        }

        function setupLevel() {
            const settings = difficultySettings[gameState.difficulty];
            
            gameState.boxes = [];
            gameState.currentSum = 0;
            gameState.history = [];
            gameState.draggedBox = null;
            
            gameState.dropZone = {
                x: canvas.width / 2 - 200,
                y: canvas.height / 2 - 150,
                width: 400,
                height: 300,
                color: '#4CAF50'
            };
            
            const boxSize = 80;
            const boxesPerRow = 4;
            const startX = 50;
            const startY = 50;
            
            const levelMultiplier = 1 + (gameState.level - 1) * 0.2;
            const minValue = Math.floor(settings.range[0] * levelMultiplier);
            const maxValue = Math.floor(settings.range[1] * levelMultiplier);
            
            const values = [];
            for (let i = 0; i < settings.boxCount; i++) {
                let value = Math.floor(Math.random() * (maxValue - minValue)) + minValue;
                if (Math.random() < settings.negativeChance) {
                    value = -value;
                }
                values.push(value);
            }
            
            const minBoxes = Math.min(3, settings.boxCount - 2);
            const maxBoxes = Math.min(settings.boxCount - 1, minBoxes + 3);
            const boxesToUse = Math.floor(Math.random() * (maxBoxes - minBoxes + 1)) + minBoxes;
            
            const shuffled = [...values].sort(() => Math.random() - 0.5);
            gameState.targetNumber = 0;
            for (let i = 0; i < boxesToUse; i++) {
                gameState.targetNumber += shuffled[i];
            }
            
            for (let i = 0; i < settings.boxCount; i++) {
                const row = Math.floor(i / boxesPerRow);
                const col = i % boxesPerRow;
                
                gameState.boxes.push({
                    id: i,
                    value: values[i],
                    x: startX + col * (boxSize + 20),
                    y: startY + row * (boxSize + 20),
                    originalX: startX + col * (boxSize + 20),
                    originalY: startY + row * (boxSize + 20),
                    width: boxSize,
                    height: boxSize,
                    isDragging: false,
                    inDropZone: false,
                    color: values[i] >= 0 ? '#2196F3' : '#FF5722'
                });
            }
            
            updateUI();
        }

        function updateUI() {
            document.getElementById('levelValue').textContent = gameState.level;
            document.getElementById('scoreValue').textContent = gameState.score;
            document.getElementById('targetValue').textContent = gameState.targetNumber;
            document.getElementById('currentValue').textContent = gameState.currentSum;
            document.getElementById('timerValue').textContent = gameState.timeLeft;
            document.getElementById('targetLevel').textContent = gameState.level;
            
            const currentValueElement = document.getElementById('currentValue');
            if (gameState.currentSum === gameState.targetNumber) {
                currentValueElement.style.color = '#4CAF50';
                currentValueElement.style.fontWeight = 'bold';
            } else {
                currentValueElement.style.color = 'inherit';
                currentValueElement.style.fontWeight = 'normal';
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = gameState.currentSum === gameState.targetNumber ? '#4CAF50' : '#FFC107';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.roundRect(
                gameState.dropZone.x,
                gameState.dropZone.y,
                gameState.dropZone.width,
                gameState.dropZone.height,
                20
            );
            ctx.fill();
            ctx.stroke();
            
            gameState.boxes.forEach(box => {
                if (!box.isDragging) {
                    drawBox(box);
                }
            });
            
            if (gameState.draggedBox) {
                drawBox(gameState.draggedBox);
            }
        }

        function drawBox(box) {
            ctx.save();
            
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 5;
            
            ctx.fillStyle = box.color;
            ctx.beginPath();
            ctx.roundRect(box.x, box.y, box.width, box.height, 10);
            ctx.fill();
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.restore();
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(box.value, box.x + box.width / 2, box.y + box.height / 2);
        }

        canvas.addEventListener('mousedown', handleMouseDown);
        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('mouseup', handleMouseUp);
        canvas.addEventListener('touchstart', handleTouchStart);
        canvas.addEventListener('touchmove', handleTouchMove);
        canvas.addEventListener('touchend', handleTouchEnd);
        
        function handleMouseDown(e) {
            if (!gameState.isPlaying || !gameState.boxes) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            for (let i = gameState.boxes.length - 1; i >= 0; i--) {
                const box = gameState.boxes[i];
                if (box && x >= box.x && x <= box.x + box.width &&
                    y >= box.y && y <= box.y + box.height) {
                    box.isDragging = true;
                    box.offsetX = x - box.x;
                    box.offsetY = y - box.y;
                    gameState.draggedBox = box;
                    break;
                }
            }
        }
        
        function handleMouseMove(e) {
            if (!gameState.isPlaying || !gameState.draggedBox) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (gameState.draggedBox) {
                gameState.draggedBox.x = x - gameState.draggedBox.offsetX;
                gameState.draggedBox.y = y - gameState.draggedBox.offsetY;
            }
        }
        
        function handleMouseUp(e) {
            if (!gameState.isPlaying) return;
            
            if (gameState.draggedBox && gameState.boxes) {
                checkDropZone(gameState.draggedBox);
                if (gameState.draggedBox) {
                    gameState.draggedBox.isDragging = false;
                }
                gameState.draggedBox = null;
            }
        }
        
        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            for (let i = gameState.boxes.length - 1; i >= 0; i--) {
                const box = gameState.boxes[i];
                if (x >= box.x && x <= box.x + box.width &&
                    y >= box.y && y <= box.y + box.height) {
                    box.isDragging = true;
                    box.offsetX = x - box.x;
                    box.offsetY = y - box.y;
                    gameState.draggedBox = box;
                    break;
                }
            }
        }
        
        function handleTouchMove(e) {
            e.preventDefault();
            if (gameState.draggedBox) {
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                
                gameState.draggedBox.x = x - gameState.draggedBox.offsetX;
                gameState.draggedBox.y = y - gameState.draggedBox.offsetY;
            }
        }
        
        function handleTouchEnd(e) {
            e.preventDefault();
            if (gameState.draggedBox) {
                checkDropZone(gameState.draggedBox);
                gameState.draggedBox.isDragging = false;
                gameState.draggedBox = null;
            }
        }
        
        function checkDropZone(box) {
            const centerX = box.x + box.width / 2;
            const centerY = box.y + box.height / 2;
            
            const inZone = (
                centerX >= gameState.dropZone.x &&
                centerX <= gameState.dropZone.x + gameState.dropZone.width &&
                centerY >= gameState.dropZone.y &&
                centerY <= gameState.dropZone.y + gameState.dropZone.height
            );
            
            if (inZone && !box.inDropZone) {
                box.inDropZone = true;
                gameState.currentSum += box.value;
                gameState.history.push({...box});
                createParticles(box.x + box.width / 2, box.y + box.height / 2);
                updateUI();
                checkWin();
            } else if (!inZone && box.inDropZone) {
                box.inDropZone = false;
                gameState.currentSum -= box.value;
                updateUI();
            } else if (!inZone) {
                box.x = box.originalX;
                box.y = box.originalY;
            }
        }
        
        function createParticles(x, y) {
            const colors = ['#FFD700', '#FFA500', '#FF6347', '#4CAF50', '#2196F3'];
            for (let i = 0; i < 10; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.width = '10px';
                particle.style.height = '10px';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.borderRadius = '50%';
                particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
                particle.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
                document.body.appendChild(particle);
                
                setTimeout(() => particle.remove(), 1000);
            }
        }
        
        function checkWin() {
            if (gameState.currentSum === gameState.targetNumber) {
                const timeBonus = gameState.timeLeft * 10;
                const levelScore = 100 * gameState.level;
                gameState.score += levelScore + timeBonus;
                
                // Başarı sesi çal
                playSuccessSound();
                
                createSuccessAnimation();
                
                gameState.boxes.forEach(box => {
                    box.inDropZone = false;
                    box.isDragging = false;
                });
                
                gameState.currentSum = 0;
                gameState.history = [];
                gameState.draggedBox = null;
                
                gameState.level++;
                
                updateUI();
                
                setTimeout(() => {
                    setupLevel();
                }, 1000);
            }
        }

        function createSuccessAnimation() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    createParticles(
                        centerX + (Math.random() - 0.5) * 200,
                        centerY + (Math.random() - 0.5) * 200
                    );
                }, i * 20);
            }
            
            showLevelCompleteNotification();
        }

        function showLevelCompleteNotification() {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: linear-gradient(45deg, #4CAF50, #8BC34A);
                color: white;
                padding: 30px 60px;
                border-radius: 20px;
                font-size: 2em;
                font-weight: bold;
                z-index: 1000;
                box-shadow: 0 20px 60px rgba(0,0,0,0.5);
                animation: levelComplete 0.5s ease-out;
                pointer-events: none;
            `;
            notification.textContent = `🎉 SEVİYE ${gameState.level - 1} TAMAMLANDI!`;
            
            if (!document.getElementById('levelCompleteStyle')) {
                const style = document.createElement('style');
                style.id = 'levelCompleteStyle';
                style.textContent = `
                    @keyframes levelComplete {
                        0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
                        50% { transform: translate(-50%, -50%) scale(1.2); }
                        100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
                    }
                `;
                document.head.appendChild(style);
            }
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'levelComplete 0.3s ease-in reverse';
                setTimeout(() => notification.remove(), 300);
            }, 1000);
        }
        
        function undoMove() {
            if (gameState.history.length > 0) {
                const lastMove = gameState.history.pop();
                const box = gameState.boxes.find(b => b.id === lastMove.id);
                if (box && box.inDropZone) {
                    box.inDropZone = false;
                    box.x = box.originalX;
                    box.y = box.originalY;
                    gameState.currentSum -= box.value;
                    updateUI();
                }
            }
        }
        
        function resetLevel() {
            gameState.boxes.forEach(box => {
                box.x = box.originalX;
                box.y = box.originalY;
                box.inDropZone = false;
                box.isDragging = false;
            });
            
            gameState.draggedBox = null;
            gameState.currentSum = 0;
            gameState.history = [];
            
            updateUI();
        }
        
        function returnToMenu() {
            gameState.isPlaying = false;
            clearInterval(gameState.timerInterval);
            
            if (backgroundMusic) {
                clearInterval(backgroundMusic);
                backgroundMusic = null;
            }
            
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('menuScreen').classList.remove('hidden');
            document.getElementById('menuScreen').classList.add('visible');
        }
        
        function gameLoop() {
            if (gameState.isPlaying) {
                updateGamepad();
                draw();
                requestAnimationFrame(gameLoop);
            }
        }
        
        window.addEventListener('resize', resizeCanvas);
        
        window.addEventListener('gamepadconnected', (e) => {
            console.log('🎮 Gamepad bağlandı:', e.gamepad.id);
            gameState.gamepad.connected = true;
            gameState.gamepad.index = e.gamepad.index;
            
            const crosshair = document.getElementById('crosshair');
            crosshair.style.display = 'block';
            
            gameState.gamepad.crosshairX = canvas.width / 2;
            gameState.gamepad.crosshairY = canvas.height / 2;
        });

        window.addEventListener('gamepaddisconnected', (e) => {
            console.log('🎮 Gamepad bağlantısı kesildi');
            gameState.gamepad.connected = false;
            gameState.gamepad.index = -1;
            
            document.getElementById('crosshair').style.display = 'none';
        });

        function updateGamepad() {
            if (!gameState.gamepad.connected || !gameState.isPlaying) return;
            
            const gamepad = navigator.getGamepads()[gameState.gamepad.index];
            if (!gamepad) return;
            
            const deadzone = 0.15;
            const sensitivity = 8;
            
            if (Math.abs(gamepad.axes[0]) > deadzone) {
                gameState.gamepad.crosshairX += gamepad.axes[0] * sensitivity;
            }
            if (Math.abs(gamepad.axes[1]) > deadzone) {
                gameState.gamepad.crosshairY += gamepad.axes[1] * sensitivity;
            }
            
            gameState.gamepad.crosshairX = Math.max(0, Math.min(canvas.width, gameState.gamepad.crosshairX));
            gameState.gamepad.crosshairY = Math.max(0, Math.min(canvas.height, gameState.gamepad.crosshairY));
            
            const rect = canvas.getBoundingClientRect();
            const crosshair = document.getElementById('crosshair');
            crosshair.style.left = (rect.left + gameState.gamepad.crosshairX - 20) + 'px';
            crosshair.style.top = (rect.top + gameState.gamepad.crosshairY - 20) + 'px';
            
            const buttonPressed = gamepad.buttons[0].pressed || gamepad.buttons[2].pressed;
            
            if (buttonPressed && !gameState.gamepad.buttonPressed) {
                gameState.gamepad.buttonPressed = true;
                handleGamepadPress(gameState.gamepad.crosshairX, gameState.gamepad.crosshairY);
            } else if (!buttonPressed && gameState.gamepad.buttonPressed) {
                gameState.gamepad.buttonPressed = false;
                handleGamepadRelease(gameState.gamepad.crosshairX, gameState.gamepad.crosshairY);
            }
            
            if (gameState.gamepad.buttonPressed && gameState.draggedBox) {
                gameState.draggedBox.x = gameState.gamepad.crosshairX - gameState.draggedBox.width / 2;
                gameState.draggedBox.y = gameState.gamepad.crosshairY - gameState.draggedBox.height / 2;
            }
        }

        function handleGamepadPress(x, y) {
            for (let i = gameState.boxes.length - 1; i >= 0; i--) {
                const box = gameState.boxes[i];
                if (x >= box.x && x <= box.x + box.width &&
                    y >= box.y && y <= box.y + box.height) {
                    box.isDragging = true;
                    box.offsetX = x - box.x;
                    box.offsetY = y - box.y;
                    gameState.draggedBox = box;
                    break;
                }
            }
        }

        function handleGamepadRelease(x, y) {
            if (gameState.draggedBox) {
                checkDropZone(gameState.draggedBox);
                gameState.draggedBox.isDragging = false;
                gameState.draggedBox = null;
            }
        }
        
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }
    </script>
</body>
