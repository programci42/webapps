<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Maker - HTML5 Video Studio</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#1e1f2b; --panel:#272838; --panel2:#2f3145; --line:#3a3c54;
    --accent:#6c8cff; --accent2:#a06cff; --text:#e7e8f2; --muted:#9a9cb8;
    --good:#39d98a; --warn:#ffb454; --danger:#ff6b6b;
  }
  html,body{ height:100%; }
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden;
    display:flex; flex-direction:column; height:100vh;
  }
  body[dir=rtl] .col-left{ border-right:none; border-left:1px solid var(--line); }
  body[dir=rtl] .col-right{ border-left:none; border-right:1px solid var(--line); }
  /* Top bar */
  .topbar{
    height:54px; flex:0 0 54px; display:flex; align-items:center; gap:10px;
    padding:0 16px; background:linear-gradient(90deg,#2a2c40,#272838);
    border-bottom:1px solid var(--line);
  }
  .logo{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.05rem; white-space:nowrap; }
  .logo i{ color:var(--accent); }
  .logo small{ color:var(--muted); font-weight:500; font-size:.72rem; }
  .topbar .spacer{ flex:1; }
  .btn{
    border:none; cursor:pointer; border-radius:9px; padding:9px 14px;
    font-size:.85rem; font-weight:600; color:var(--text);
    background:var(--panel2); transition:.15s; display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  }
  .btn:hover{ filter:brightness(1.15); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.primary{ background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  .btn.good{ background:var(--good); color:#06281a; }
  .btn.ghost{ background:transparent; border:1px solid var(--line); }
  .btn.sm{ padding:6px 9px; font-size:.78rem; }
  .lang-sel{ background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:7px 9px; font-size:.82rem; cursor:pointer; font-family:inherit; }

  /* Main layout */
  .main{ flex:1; display:flex; min-height:0; }
  .col-left{ width:270px; flex:0 0 270px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .col-center{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .col-right{ width:285px; flex:0 0 285px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }

  .panel-title{ padding:12px 14px; font-size:.78rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:700; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  .panel-title i{ color:var(--accent); }

  /* Media bin */
  .media-actions{ padding:10px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--line); }
  .tabs{ display:flex; gap:4px; padding:8px 10px 0; }
  .tabs button{ flex:1; border:none; background:var(--panel2); color:var(--muted); padding:9px; border-radius:8px 8px 0 0; cursor:pointer; font-size:.8rem; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; }
  .tabs button.on{ background:var(--accent); color:#fff; }
  .media-list{ flex:1; overflow-y:auto; padding:10px; display:grid; grid-template-columns:1fr 1fr; gap:8px; align-content:start; }
  .media-list[hidden]{ display:none; }
  .media-item{ position:relative; background:var(--panel2); border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer; aspect-ratio:16/10; }
  .media-item img,.media-item video{ width:100%; height:100%; object-fit:cover; display:block; }
  .media-item .ic{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1.6rem; color:var(--muted); }
  .media-item .tag{ position:absolute; top:4px; left:4px; background:rgba(0,0,0,.6); font-size:.6rem; padding:2px 5px; border-radius:5px; text-transform:uppercase; }
  .media-item .add{ position:absolute; bottom:4px; right:4px; background:var(--accent); border:none; color:#fff; width:24px; height:24px; border-radius:6px; cursor:pointer; font-size:.8rem; }
  .media-item .rm{ position:absolute; top:4px; right:4px; background:rgba(0,0,0,.6); border:none; color:#fff; width:20px; height:20px; border-radius:5px; cursor:pointer; font-size:.65rem; opacity:0; transition:.15s; }
  .media-item:hover .rm{ opacity:1; }
  .media-item .name{ position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.55); font-size:.6rem; padding:2px 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .audio-item{ aspect-ratio:auto; height:54px; display:flex; align-items:center; gap:8px; padding:8px; cursor:default; }
  .audio-item .ic{ position:static; font-size:1.1rem; color:var(--good); width:auto; }
  .audio-item .an{ flex:1; font-size:.72rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .audio-item .add{ position:static; }
  .empty-hint{ grid-column:1/-1; color:var(--muted); font-size:.8rem; text-align:center; padding:20px 8px; line-height:1.5; }

  /* Preview */
  .preview-wrap{ flex:1; display:flex; align-items:center; justify-content:center; background:#15161f; min-height:0; padding:14px; }
  #stage{ background:#000; max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 8px 40px rgba(0,0,0,.5); }
  .transport{ flex:0 0 auto; background:var(--panel); border-top:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; gap:14px; }
  .transport .time{ font-variant-numeric:tabular-nums; font-size:.85rem; color:var(--muted); min-width:120px; }
  .scrub{ flex:1; }
  input[type=range]{ width:100%; accent-color:var(--accent); cursor:pointer; }
  .icon-btn{ background:var(--panel2); border:1px solid var(--line); color:var(--text); width:40px; height:40px; border-radius:10px; cursor:pointer; font-size:1rem; }
  .icon-btn:hover{ filter:brightness(1.2); }
  .icon-btn.big{ width:48px; height:48px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; font-size:1.15rem; }

  /* Right inspector */
  .insp{ flex:1; overflow-y:auto; padding:14px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:.72rem; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }
  .field input[type=text],.field textarea,.field select,.field input[type=number]{
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:9px 10px; font-size:.85rem; font-family:inherit;
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .field .row{ display:flex; gap:8px; align-items:center; }
  .swatches{ display:flex; gap:6px; flex-wrap:wrap; }
  .swatch{ width:24px; height:24px; border-radius:6px; border:2px solid transparent; cursor:pointer; }
  .swatch.sel{ border-color:#fff; }
  .no-sel{ color:var(--muted); font-size:.85rem; text-align:center; padding:30px 10px; line-height:1.6; }
  .seg{ display:flex; background:var(--panel2); border-radius:8px; padding:3px; gap:3px; }
  .seg button{ flex:1; border:none; background:transparent; color:var(--muted); padding:7px; border-radius:6px; cursor:pointer; font-size:.78rem; font-weight:600; }
  .seg button.on{ background:var(--accent); color:#fff; }

  /* Timeline */
  .timeline{ flex:0 0 186px; background:var(--panel); border-top:1px solid var(--line); display:flex; flex-direction:column; }
  .tl-head{ display:flex; align-items:center; gap:12px; padding:8px 14px; border-bottom:1px solid var(--line); }
  .tl-head .lbl{ font-size:.78rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:700; }
  .tracks{ flex:1; overflow-x:auto; overflow-y:hidden; padding:10px; }
  .track-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .track-ic{ width:30px; flex:0 0 30px; text-align:center; color:var(--muted); }
  .clips{ display:flex; gap:6px; align-items:stretch; min-height:64px; }
  .clip{ position:relative; min-width:72px; height:64px; border-radius:8px; overflow:hidden; cursor:grab; border:2px solid transparent; background:var(--panel2); flex:0 0 auto; }
  .clip:active{ cursor:grabbing; }
  .clip.sel{ border-color:var(--accent); box-shadow:0 0 0 2px rgba(108,140,255,.3); }
  .clip.dragging{ opacity:.35; }
  .clip.dragover{ border-color:var(--accent2); box-shadow:0 0 0 2px rgba(160,108,255,.4); }
  .clip img,.clip video{ width:100%; height:100%; object-fit:cover; pointer-events:none; }
  .clip .ci{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:1.2rem; }
  .clip .dur{ position:absolute; bottom:2px; right:3px; font-size:.6rem; background:rgba(0,0,0,.65); padding:1px 4px; border-radius:4px; }
  .clip .lbl{ position:absolute; top:2px; left:3px; font-size:.6rem; background:rgba(0,0,0,.55); padding:1px 4px; border-radius:4px; max-width:62%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .clip .del{ position:absolute; top:2px; right:2px; width:18px; height:18px; border:none; border-radius:4px; background:rgba(0,0,0,.6); color:#fff; cursor:pointer; font-size:.6rem; opacity:0; transition:.15s; }
  .clip:hover .del{ opacity:1; }
  .clip .mv{ position:absolute; top:50%; transform:translateY(-50%); width:18px; height:30px; border:none; background:rgba(0,0,0,.6); color:#fff; cursor:pointer; font-size:.7rem; opacity:0; transition:.15s; display:flex; align-items:center; justify-content:center; z-index:2; }
  .clip:hover .mv{ opacity:.9; }
  .clip .mv:hover{ background:var(--accent); }
  .clip .mv.l{ left:0; border-radius:0 6px 6px 0; }
  .clip .mv.r{ right:0; border-radius:6px 0 0 6px; }
  .clip .trans-badge{ position:absolute; bottom:2px; left:3px; font-size:.58rem; background:rgba(160,108,255,.85); padding:1px 4px; border-radius:4px; }
  .audio-clip{ background:linear-gradient(135deg,#2c6e49,#1d4d34); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:3px; color:#d8f5e6; font-size:.7rem; cursor:default; }
  .tl-empty{ color:var(--muted); font-size:.85rem; padding:18px; }
  .playhead-tl{ font-variant-numeric:tabular-nums; color:var(--muted); font-size:.78rem; }

  /* Modal */
  .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; align-items:center; justify-content:center; z-index:50; }
  .modal-bg.show{ display:flex; }
  .modal{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; width:420px; max-width:92vw; }
  .modal h3{ margin-bottom:14px; display:flex; align-items:center; gap:9px; }
  .prog-bar{ height:10px; background:var(--panel2); border-radius:6px; overflow:hidden; margin:14px 0; }
  .prog-fill{ height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:.2s; }
  .modal .muted{ color:var(--muted); font-size:.82rem; line-height:1.5; }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line); padding:11px 18px; border-radius:10px; font-size:.85rem; z-index:60; opacity:0; transition:.3s; pointer-events:none; }
  .toast.show{ opacity:1; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; }
  ::-webkit-scrollbar-track{ background:transparent; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo"><i class="fa-solid fa-film"></i> Movie Maker <small id="t_subtitle">HTML5 Video Studio</small></div>
  <div class="spacer"></div>
  <select class="lang-sel" id="langSel" title="Language"></select>
  <button class="btn ghost sm" id="aspectBtn"><i class="fa-solid fa-crop-simple"></i> 16:9</button>
  <button class="btn ghost sm" id="newProjectBtn"><i class="fa-solid fa-file"></i> <span id="t_new">New</span></button>
  <button class="btn ghost sm" id="saveProjectBtn"><i class="fa-solid fa-floppy-disk"></i> <span id="t_save">Save</span></button>
  <button class="btn ghost sm" id="loadProjectBtn"><i class="fa-solid fa-folder-open"></i> <span id="t_load">Open</span></button>
  <input type="file" id="loadInput" accept="application/json,.json" hidden>
  <button class="btn primary" id="exportBtn"><i class="fa-solid fa-download"></i> <span id="t_export">Export Video</span></button>
</div>

<div class="main">
  <!-- LEFT: MEDIA BIN -->
  <div class="col-left">
    <div class="panel-title"><i class="fa-solid fa-photo-film"></i> <span id="t_mediaLib">Media Library</span></div>
    <div class="media-actions">
      <button class="btn primary sm" id="importBtn"><i class="fa-solid fa-upload"></i> <span id="t_import">Import Media</span></button>
      <button class="btn ghost sm" id="addTitleBtn"><i class="fa-solid fa-font"></i> <span id="t_addTitle">Add Title Card</span></button>
      <input type="file" id="fileInput" accept="image/*,video/*,audio/*" multiple hidden>
    </div>
    <div class="tabs">
      <button class="on" id="tabImagesBtn" data-tab="images"><i class="fa-solid fa-image"></i> <span id="t_tabImages">Images</span></button>
      <button id="tabAudioBtn" data-tab="audio"><i class="fa-solid fa-music"></i> <span id="t_tabAudio">Audio</span></button>
    </div>
    <div class="media-list" id="mediaListImages"></div>
    <div class="media-list" id="mediaListAudio" hidden></div>
  </div>

  <!-- CENTER: PREVIEW + TIMELINE -->
  <div class="col-center">
    <div class="preview-wrap">
      <canvas id="stage" width="1280" height="720"></canvas>
    </div>
    <div class="transport">
      <button class="icon-btn" id="toStartBtn"><i class="fa-solid fa-backward-step"></i></button>
      <button class="icon-btn big" id="playBtn"><i class="fa-solid fa-play"></i></button>
      <span class="time" id="timeLabel">0.0s / 0.0s</span>
      <input type="range" class="scrub" id="scrub" min="0" max="1000" value="0">
    </div>

    <!-- TIMELINE -->
    <div class="timeline">
      <div class="tl-head">
        <span class="lbl"><i class="fa-solid fa-bars-staggered"></i> <span id="t_timeline">Timeline</span></span>
        <span class="playhead-tl" id="tlTotal"></span>
        <div class="spacer" style="flex:1"></div>
        <button class="btn ghost sm" id="clearTlBtn"><i class="fa-solid fa-trash"></i> <span id="t_clear">Clear</span></button>
      </div>
      <div class="tracks">
        <div class="track-row">
          <div class="track-ic"><i class="fa-solid fa-film"></i></div>
          <div class="clips" id="videoTrack"></div>
        </div>
        <div class="track-row">
          <div class="track-ic"><i class="fa-solid fa-music"></i></div>
          <div class="clips" id="audioTrack"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT: INSPECTOR -->
  <div class="col-right">
    <div class="panel-title"><i class="fa-solid fa-sliders"></i> <span id="t_props">Properties</span></div>
    <div class="insp" id="inspector"></div>
  </div>
</div>

<!-- EXPORT MODAL -->
<div class="modal-bg" id="exportModal">
  <div class="modal">
    <h3><i class="fa-solid fa-download"></i> <span id="t_exTitle">Export Video</span></h3>
    <div id="exportSetup">
      <div class="field">
        <label id="t_exFormat">File Format</label>
        <div class="seg" id="formatSeg">
          <button class="on" data-fmt="webm">WebM</button>
          <button data-fmt="mp4">MP4</button>
        </div>
      </div>
      <div class="field">
        <label id="t_exRes">Resolution</label>
        <select id="resSelect">
          <option value="1280x720">720p (1280×720)</option>
          <option value="1920x1080">1080p (1920×1080)</option>
          <option value="854x480">480p (854×480)</option>
        </select>
      </div>
      <div class="field">
        <label id="t_exQuality">Quality</label>
        <select id="qualitySelect"></select>
      </div>
      <p class="muted" id="fmtNote"></p>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn ghost" id="exportCancel" style="flex:1" >Cancel</button>
        <button class="btn good" id="exportStart" style="flex:2"><i class="fa-solid fa-circle-dot"></i> <span id="t_exStart">Start Recording</span></button>
      </div>
    </div>
    <div id="exportProgress" style="display:none">
      <p class="muted" id="t_exProcMsg">The video is rendered in real time. Please keep this tab open…</p>
      <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
      <p class="muted" id="progText"></p>
      <button class="btn ghost" id="exportStop" style="width:100%; margin-top:10px;">Stop</button>
    </div>
    <div id="exportDone" style="display:none; text-align:center;">
      <i class="fa-solid fa-circle-check" style="color:var(--good); font-size:2.4rem;"></i>
      <h3 style="justify-content:center; margin-top:12px;" id="t_exDone">Video Ready!</h3>
      <p class="muted" id="doneInfo"></p>
      <a id="downloadLink" class="btn good" style="width:100%; margin-top:14px; justify-content:center;" download><i class="fa-solid fa-download"></i> <span id="t_exDownload">Download</span></a>
      <button class="btn ghost" id="exportClose" style="width:100%; margin-top:10px;">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function t(key){ const l=I18N[state.lang]||I18N.en; return (key in l)? l[key] : (I18N.en[key]||key); }

// ============================================================
//  STATE & CONSTANTS
// ============================================================
const state = {
  lang: localStorage.getItem('mm_lang') || 'en',
  media: [], clips: [], audio: null, selectedClip: null, aspect: '16:9',
  tab:'images',
  playing:false, exporting:false, time:0, _raf:null, _startWall:0, _startTime:0,
};
let mediaSeq=0, clipSeq=0;

const ASPECTS = { '16:9':[1280,720], '9:16':[720,1280], '1:1':[900,900], '4:3':[960,720] };
const TEXT_COLORS = ['#ffffff','#000000','#6c8cff','#39d98a','#ffb454','#ff6b6b','#a06cff'];
const BG_COLORS   = ['#000000','#1e1f2b','#6c8cff','#a06cff','#39d98a','#ff6b6b','#ffb454','#ffffff'];
const FILTER_KEYS = ['none','grayscale','sepia','bright','contrast','blur','vintage'];
const FILTER_T = {none:'fNone',grayscale:'fGray',sepia:'fSepia',bright:'fBright',contrast:'fContrast',blur:'fBlur',vintage:'fVintage'};
const FILTERS = {
  none:'none', grayscale:'grayscale(1)', sepia:'sepia(0.85)',
  bright:'brightness(1.3) saturate(1.1)', contrast:'contrast(1.4)',
  blur:'blur(4px)', vintage:'sepia(0.4) contrast(1.1) saturate(1.3) brightness(1.05)'
};
const TRANSITION_KEYS = ['none','fade','fadeblack','slideleft','slideright','slideup','slidedown','wipeleft','wiperight','zoom','circle'];
const TRANSITION_T = {none:'trNone',fade:'trFade',fadeblack:'trFadeBlack',slideleft:'trSlideL',slideright:'trSlideR',
  slideup:'trSlideU',slidedown:'trSlideD',wipeleft:'trWipeL',wiperight:'trWipeR',zoom:'trZoom',circle:'trCircle'};

// ============================================================
//  LANGUAGE APPLY
// ============================================================
function buildLangSelect(){
  const sel=$('#langSel');
  sel.innerHTML=LANGS.map(l=>`<option value="${l.code}">${l.name}</option>`).join('');
  sel.value=state.lang;
  sel.onchange=()=>{ state.lang=sel.value; localStorage.setItem('mm_lang',state.lang); applyLang(); };
}
function setTxt(id,key){ const e=document.getElementById(id); if(e) e.textContent=t(key); }
function applyLang(){
  document.documentElement.lang=state.lang;
  document.body.setAttribute('dir', state.lang==='ar'?'rtl':'ltr');
  setTxt('t_subtitle','subtitle'); setTxt('t_new','neww'); setTxt('t_save','save'); setTxt('t_load','load');
  setTxt('t_export','export'); setTxt('t_mediaLib','mediaLib'); setTxt('t_import','import'); setTxt('t_addTitle','addTitle');
  setTxt('t_tabImages','tabImages'); setTxt('t_tabAudio','tabAudio'); setTxt('t_timeline','timeline');
  setTxt('t_clear','clear'); setTxt('t_props','props');
  setTxt('t_exTitle','exTitle'); setTxt('t_exFormat','exFormat'); setTxt('t_exRes','exRes'); setTxt('t_exQuality','exQuality');
  setTxt('t_exStart','exStart'); setTxt('t_exProcMsg','exProcMsg'); setTxt('t_exDone','exDone');
  setTxt('t_exDownload','download');
  $('#exportCancel').textContent=t('cancel'); $('#exportClose').textContent=t('close'); $('#exportStop').textContent=t('stop');
  $('#playBtn').title=t('playTip'); $('#toStartBtn').title=t('startTip');
  // quality select
  const q=$('#qualitySelect'); const qv=q.value||'5000000';
  q.innerHTML=`<option value="8000000">${t('qHigh')}</option><option value="5000000">${t('qMedium')}</option><option value="2500000">${t('qLow')}</option>`;
  q.value=qv;
  buildLangSelectValue();
  renderMedia(); renderTimeline(); renderInspector(); updateFmtNote(); updateTimeUI();
  renderFrame();
}
function buildLangSelectValue(){ const s=$('#langSel'); if(s) s.value=state.lang; }

// ============================================================
//  MEDIA IMPORT  (base64 for images/video, uint8array for audio)
// ============================================================
const readDataURL = file => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });

$('#importBtn').onclick = ()=> $('#fileInput').click();
$('#fileInput').onchange = async e => { for(const f of e.target.files) await addMediaFile(f); e.target.value=''; };

async function addMediaFile(file){
  const type = file.type.startsWith('image') ? 'image'
             : file.type.startsWith('video') ? 'video'
             : file.type.startsWith('audio') ? 'audio' : null;
  if(!type){ toast(t('unsupported')); return; }
  const m = { id:++mediaSeq, type, name:file.name, mime:file.type, duration:4, el:null };

  if(type==='image' || type==='video'){
    const dataUrl = await readDataURL(file);     // base64
    m.dataUrl = dataUrl; m.url = dataUrl;
    buildMediaElement(m);
  } else { // audio -> uint8array
    const buf = await file.arrayBuffer();
    m.bytes = new Uint8Array(buf);
    const blob = new Blob([m.bytes], { type:file.type });
    m.url = URL.createObjectURL(blob);
    buildMediaElement(m);
  }
  state.media.push(m); renderMedia();
}

function buildMediaElement(m){
  if(m.type==='image'){
    const img=new Image(); img.src=m.url; img.onload=()=>renderMedia(); m.el=img;
  } else if(m.type==='video'){
    const v=document.createElement('video'); v.src=m.url; v.preload='auto'; v.muted=true;
    v.onloadedmetadata=()=>{ m.mediaDur=v.duration||4; renderMedia(); }; m.el=v;
  } else if(m.type==='audio'){
    const a=document.createElement('audio'); a.src=m.url; a.preload='auto';
    a.onloadedmetadata=()=>{ m.mediaDur=a.duration||4; renderMedia(); }; m.el=a;
  }
}

$('#addTitleBtn').onclick = ()=>{
  const id=++mediaSeq;
  state.media.push({ id, type:'title', name:t('title'), el:null, duration:3 });
  renderMedia(); addClipFromMedia(id);
};

// ---- Media tabs ----
$('#tabImagesBtn').onclick=()=>switchTab('images');
$('#tabAudioBtn').onclick=()=>switchTab('audio');
function switchTab(tab){
  state.tab=tab;
  $('#tabImagesBtn').classList.toggle('on',tab==='images');
  $('#tabAudioBtn').classList.toggle('on',tab==='audio');
  $('#mediaListImages').hidden = tab!=='images';
  $('#mediaListAudio').hidden = tab!=='audio';
}

function renderMedia(){
  const imgs=state.media.filter(m=>m.type!=='audio');
  const auds=state.media.filter(m=>m.type==='audio');
  const li=$('#mediaListImages'), la=$('#mediaListAudio');
  // images / videos / titles
  if(!imgs.length){ li.innerHTML=`<div class="empty-hint">${t('emptyImages')}</div>`; }
  else{
    li.innerHTML='';
    imgs.forEach(m=>{
      const d=document.createElement('div'); d.className='media-item';
      let inner='';
      if(m.type==='image') inner=`<img src="${m.url}">`;
      else if(m.type==='video') inner=`<video src="${m.url}" muted></video>`;
      else inner=`<div class="ic"><i class="fa-solid fa-font"></i></div>`;
      const tag = m.type==='image'?t('photo'):m.type==='video'?t('video'):t('title');
      d.innerHTML=inner+`<span class="tag">${tag}</span><span class="name">${m.name}</span>`+
        `<button class="rm" title="${t('removeTip')}"><i class="fa-solid fa-xmark"></i></button>`+
        `<button class="add" title="${t('addTip')}">+</button>`;
      d.querySelector('.add').onclick=()=>addClipFromMedia(m.id);
      d.querySelector('.rm').onclick=()=>removeMedia(m.id);
      li.appendChild(d);
    });
  }
  // audio
  if(!auds.length){ la.innerHTML=`<div class="empty-hint">${t('emptyAudio')}</div>`; }
  else{
    la.innerHTML='';
    auds.forEach(m=>{
      const d=document.createElement('div'); d.className='media-item audio-item';
      d.innerHTML=`<span class="ic"><i class="fa-solid fa-music"></i></span><span class="an">${m.name}</span>`+
        `<button class="add" title="${t('addTip')}">+</button>`;
      d.querySelector('.add').onclick=()=>addClipFromMedia(m.id);
      la.appendChild(d);
    });
  }
}
function removeMedia(id){
  // also remove clips using it
  state.clips=state.clips.filter(c=>c.mediaId!==id);
  if(state.audio && state.audio.mediaId===id) state.audio=null;
  state.media=state.media.filter(m=>m.id!==id);
  renderMedia(); renderTimeline(); renderInspector(); seek(Math.min(state.time,totalDuration()));
}

// ============================================================
//  TIMELINE
// ============================================================
function addClipFromMedia(mediaId){
  const m=mediaById(mediaId); if(!m) return;
  if(m.type==='audio'){ state.audio={ mediaId, el:m.el, volume:1 }; toast(t('musicAdded')); renderTimeline(); switchTab('audio'); return; }
  const clip={
    id:++clipSeq, type:m.type, mediaId,
    duration: m.type==='video' ? Math.min(m.mediaDur||4,30) : (m.type==='title'?3:4),
    trimStart:0, text: m.type==='title'?'Title':'',
    textColor:'#ffffff', textPos:'center', fontSize:64,
    bgColor: m.type==='title'?'#1e1f2b':'#000000',
    fit:'contain', filter:'none', fadeIn:false, fadeOut:false,
    kenBurns: m.type==='image', transition:'none', transDur:0.7,
  };
  state.clips.push(clip); selectClip(clip.id); renderTimeline(); switchTab('images'); seek(state.time);
}

function totalDuration(){ return state.clips.reduce((s,c)=>s+c.duration,0); }

let dragId=null;
function renderTimeline(){
  const vt=$('#videoTrack'), at=$('#audioTrack');
  if(!state.clips.length){
    vt.innerHTML=`<div class="tl-empty">${t('tlEmptyVideo')}</div>`;
  } else {
    vt.innerHTML='';
    state.clips.forEach((c,idx)=>{
      const m=mediaById(c.mediaId);
      const el=document.createElement('div');
      el.className='clip'+(state.selectedClip===c.id?' sel':'');
      el.style.width=Math.max(72,c.duration*22)+'px';
      el.draggable=true; el.dataset.id=c.id;
      let thumb='';
      if(c.type==='image'&&m) thumb=`<img src="${m.url}">`;
      else if(c.type==='video'&&m) thumb=`<video src="${m.url}" muted></video>`;
      else thumb=`<div class="ci" style="background:${c.bgColor}"><i class="fa-solid fa-font"></i></div>`;
      const transBadge = c.transition && c.transition!=='none' ? `<span class="trans-badge"><i class="fa-solid fa-wand-magic-sparkles"></i></span>` : '';
      el.innerHTML=thumb+
        `<button class="mv l" title="${t('moveLeft')}"><i class="fa-solid fa-chevron-left"></i></button>`+
        `<button class="mv r" title="${t('moveRight')}"><i class="fa-solid fa-chevron-right"></i></button>`+
        `<span class="lbl">${c.type==='title'?(c.text||t('title')):(m?m.name:'')}</span>`+
        `<span class="dur">${c.duration.toFixed(1)}s</span>`+ transBadge +
        `<button class="del" title="${t('delClip')}"><i class="fa-solid fa-xmark"></i></button>`;
      el.onclick=e=>{ if(e.target.closest('.del')||e.target.closest('.mv')) return; selectClip(c.id); };
      el.querySelector('.del').onclick=e=>{ e.stopPropagation(); deleteClip(c.id); };
      el.querySelector('.mv.l').onclick=e=>{ e.stopPropagation(); moveClip(c.id,-1); };
      el.querySelector('.mv.r').onclick=e=>{ e.stopPropagation(); moveClip(c.id,1); };
      // drag reorder
      el.ondragstart=e=>{ dragId=c.id; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; };
      el.ondragend=()=>{ el.classList.remove('dragging'); document.querySelectorAll('.clip.dragover').forEach(x=>x.classList.remove('dragover')); };
      el.ondragover=e=>{ e.preventDefault(); el.classList.add('dragover'); };
      el.ondragleave=()=>el.classList.remove('dragover');
      el.ondrop=e=>{ e.preventDefault(); el.classList.remove('dragover'); reorderClip(dragId,c.id); };
      vt.appendChild(el);
    });
  }
  if(!state.audio){
    at.innerHTML=`<div class="tl-empty">${t('tlEmptyAudio')}</div>`;
  } else {
    const m=mediaById(state.audio.mediaId);
    at.innerHTML='';
    const el=document.createElement('div'); el.className='clip audio-clip';
    el.style.width=Math.max(120,(m?.mediaDur||totalDuration()||6)*22)+'px';
    el.innerHTML=`<i class="fa-solid fa-music"></i><span>${m?m.name:'Audio'}</span><button class="del">×</button>`;
    el.querySelector('.del').onclick=()=>{ state.audio=null; renderTimeline(); };
    at.appendChild(el);
  }
  $('#tlTotal').textContent=t('total')+': '+totalDuration().toFixed(1)+'s';
  updateTimeUI();
}

function moveClip(id,dir){
  const i=state.clips.findIndex(c=>c.id===id); const j=i+dir;
  if(i<0||j<0||j>=state.clips.length) return;
  [state.clips[i],state.clips[j]]=[state.clips[j],state.clips[i]];
  renderTimeline(); seek(state.time);
}
function reorderClip(srcId,destId){
  if(srcId==null||srcId===destId) return;
  const src=state.clips.find(c=>c.id===srcId); if(!src) return;
  state.clips=state.clips.filter(c=>c.id!==srcId);
  const di=state.clips.findIndex(c=>c.id===destId);
  state.clips.splice(di<0?state.clips.length:di,0,src);
  renderTimeline(); seek(state.time);
}
function deleteClip(id){
  state.clips=state.clips.filter(c=>c.id!==id);
  if(state.selectedClip===id){ state.selectedClip=null; renderInspector(); }
  renderTimeline(); seek(Math.min(state.time,totalDuration()));
}
$('#clearTlBtn').onclick=()=>{
  if(!state.clips.length&&!state.audio) return;
  state.clips=[]; state.audio=null; state.selectedClip=null;
  renderInspector(); renderTimeline(); pause(); seek(0);
};

// ============================================================
//  INSPECTOR
// ============================================================
function selectClip(id){ state.selectedClip=id; renderTimeline(); renderInspector(); }

function renderInspector(){
  const box=$('#inspector');
  const c=state.clips.find(x=>x.id===state.selectedClip);
  if(!c){ box.innerHTML=`<div class="no-sel">${t('noSel')}</div>`; return; }
  const m=mediaById(c.mediaId);
  let html='';
  html+=`<div class="field"><label>${t('duration')}</label>
    <div class="row"><input type="range" id="f_dur" min="0.5" max="30" step="0.5" value="${c.duration}">
    <span id="f_dur_v" style="min-width:42px;text-align:right">${c.duration.toFixed(1)}s</span></div></div>`;
  html+=`<div class="field"><label>${c.type==='title'?t('titleText'):t('overlayText')}</label>
    <textarea id="f_text" placeholder="${t('textPh')}">${c.text||''}</textarea></div>`;
  if(c.text||c.type==='title'){
    html+=`<div class="field"><label>${t('textPos')}</label><div class="seg" id="f_pos">
      <button data-v="top" class="${c.textPos==='top'?'on':''}">${t('posTop')}</button>
      <button data-v="center" class="${c.textPos==='center'?'on':''}">${t('posCenter')}</button>
      <button data-v="bottom" class="${c.textPos==='bottom'?'on':''}">${t('posBottom')}</button></div></div>`;
    html+=`<div class="field"><label>${t('fontSize')}</label><div class="row">
      <input type="range" id="f_fs" min="20" max="140" value="${c.fontSize}">
      <span style="min-width:34px;text-align:right" id="f_fs_v">${c.fontSize}</span></div></div>`;
    html+=`<div class="field"><label>${t('textColor')}</label><div class="swatches" id="f_tc">`+
      TEXT_COLORS.map(col=>`<div class="swatch ${c.textColor===col?'sel':''}" data-c="${col}" style="background:${col}"></div>`).join('')+`</div></div>`;
  }
  if(c.type==='title'){
    html+=`<div class="field"><label>${t('bgColor')}</label><div class="swatches" id="f_bg">`+
      BG_COLORS.map(col=>`<div class="swatch ${c.bgColor===col?'sel':''}" data-c="${col}" style="background:${col}"></div>`).join('')+`</div></div>`;
  }
  if(c.type==='image'||c.type==='video'){
    html+=`<div class="field"><label>${t('fit')}</label><div class="seg" id="f_fit">
      <button data-v="contain" class="${c.fit==='contain'?'on':''}">${t('fitContain')}</button>
      <button data-v="cover" class="${c.fit==='cover'?'on':''}">${t('fitCover')}</button></div></div>`;
    html+=`<div class="field"><label>${t('filter')}</label><select id="f_filter">`+
      FILTER_KEYS.map(f=>`<option value="${f}" ${c.filter===f?'selected':''}>${t(FILTER_T[f])}</option>`).join('')+`</select></div>`;
    if(c.type==='image')
      html+=`<div class="field"><label class="row" style="text-transform:none;color:var(--text)"><input type="checkbox" id="f_kb" ${c.kenBurns?'checked':''} style="width:auto;margin-right:8px"> ${t('kenBurns')}</label></div>`;
  }
  // transition to next scene
  html+=`<div class="field"><label>${t('transition')}</label><select id="f_trans">`+
    TRANSITION_KEYS.map(tr=>`<option value="${tr}" ${(c.transition||'none')===tr?'selected':''}>${t(TRANSITION_T[tr])}</option>`).join('')+`</select></div>`;
  if((c.transition||'none')!=='none'){
    html+=`<div class="field"><label>${t('transDur')}</label><div class="row">
      <input type="range" id="f_td" min="0.2" max="2" step="0.1" value="${c.transDur||0.7}">
      <span style="min-width:42px;text-align:right" id="f_td_v">${(c.transDur||0.7).toFixed(1)}s</span></div></div>`;
  }
  // open/close fades
  html+=`<div class="field"><label>${t('openClose')}</label><div class="row" style="gap:14px">
    <label style="text-transform:none;color:var(--text)"><input type="checkbox" id="f_fi" ${c.fadeIn?'checked':''} style="width:auto;margin-right:6px">${t('fadeIn')}</label>
    <label style="text-transform:none;color:var(--text)"><input type="checkbox" id="f_fo" ${c.fadeOut?'checked':''} style="width:auto;margin-right:6px">${t('fadeOut')}</label></div></div>`;
  if(c.type==='video'){
    html+=`<div class="field"><label>${t('trimStart')}</label>
      <input type="number" id="f_trim" min="0" max="${(m?.mediaDur||0).toFixed(1)}" step="0.5" value="${c.trimStart}"></div>`;
  }
  box.innerHTML=html; wireInspector(c);
}

function wireInspector(c){
  const on=(id,ev,fn)=>{ const e=$('#'+id); if(e) e.addEventListener(ev,fn); };
  on('f_dur','input',e=>{ c.duration=+e.target.value; $('#f_dur_v').textContent=c.duration.toFixed(1)+'s'; renderTimeline(); seek(state.time); });
  on('f_text','input',e=>{ c.text=e.target.value; renderTimeline(); seek(state.time); });
  on('f_fs','input',e=>{ c.fontSize=+e.target.value; $('#f_fs_v').textContent=c.fontSize; seek(state.time); });
  on('f_filter','change',e=>{ c.filter=e.target.value; seek(state.time); });
  on('f_kb','change',e=>{ c.kenBurns=e.target.checked; seek(state.time); });
  on('f_trans','change',e=>{ c.transition=e.target.value; renderInspector(); renderTimeline(); seek(state.time); });
  on('f_td','input',e=>{ c.transDur=+e.target.value; $('#f_td_v').textContent=c.transDur.toFixed(1)+'s'; seek(state.time); });
  on('f_fi','change',e=>{ c.fadeIn=e.target.checked; seek(state.time); });
  on('f_fo','change',e=>{ c.fadeOut=e.target.checked; seek(state.time); });
  on('f_trim','input',e=>{ c.trimStart=+e.target.value; seek(state.time); });
  const seg=(id,fn)=>{ const w=$('#'+id); if(!w)return; w.querySelectorAll('button').forEach(b=>b.onclick=()=>{ w.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); fn(b.dataset.v); seek(state.time); }); };
  seg('f_pos',v=>c.textPos=v); seg('f_fit',v=>c.fit=v);
  const sw=(id,fn)=>{ const w=$('#'+id); if(!w)return; w.querySelectorAll('.swatch').forEach(s=>s.onclick=()=>{ w.querySelectorAll('.swatch').forEach(x=>x.classList.remove('sel')); s.classList.add('sel'); fn(s.dataset.c); renderTimeline(); seek(state.time); }); };
  sw('f_tc',v=>c.textColor=v); sw('f_bg',v=>c.bgColor=v);
}

// ============================================================
//  RENDER ENGINE (with transitions)
// ============================================================
function clipIndexAtTime(t){
  if(!state.clips.length) return null;
  let acc=0;
  for(let i=0;i<state.clips.length;i++){
    const c=state.clips[i];
    if(t<acc+c.duration || i===state.clips.length-1)
      return { i, local:Math.max(0,Math.min(c.duration,t-acc)), start:acc };
    acc+=c.duration;
  }
  return null;
}

const _bufs={};
function getBuf(tag,W,H){
  const key=tag+W+'x'+H;
  if(!_bufs[key]){ const cv=document.createElement('canvas'); cv.width=W; cv.height=H; _bufs[key]={canvas:cv,ctx:cv.getContext('2d')}; }
  return _bufs[key];
}

function drawFit(g,W,H,el,c,local){
  const mw=el.videoWidth||el.naturalWidth, mh=el.videoHeight||el.naturalHeight;
  if(!mw||!mh) return;
  let scale=c.fit==='cover'?Math.max(W/mw,H/mh):Math.min(W/mw,H/mh);
  if(c.kenBurns&&c.type==='image'){ const p=c.duration?local/c.duration:0; scale*=(1+0.08*p); }
  const dw=mw*scale,dh=mh*scale;
  g.drawImage(el,(W-dw)/2,(H-dh)/2,dw,dh);
}
function drawTextG(g,W,H,c){
  const fs=c.fontSize*(W/1280);
  g.font=`700 ${fs}px Inter, Segoe UI, sans-serif`;
  g.textAlign='center'; g.textBaseline='middle';
  const lines=(c.text||'').split('\n'); const lh=fs*1.2;
  let y=c.textPos==='top'?H*0.16:c.textPos==='bottom'?H*0.84-(lines.length-1)*lh:H/2;
  lines.forEach((ln,i)=>{ const yy=y+i*lh;
    g.lineWidth=fs*0.12; g.strokeStyle='rgba(0,0,0,.55)'; g.lineJoin='round'; g.strokeText(ln,W/2,yy);
    g.fillStyle=c.textColor||'#fff'; g.fillText(ln,W/2,yy);
  });
}
function paintClip(g,W,H,c,local){
  g.save(); g.globalAlpha=1; g.filter='none';
  g.clearRect(0,0,W,H);
  g.fillStyle=c.bgColor||'#000'; g.fillRect(0,0,W,H);
  const m=mediaById(c.mediaId);
  g.filter=FILTERS[c.filter]||'none';
  if(c.type==='image'&&m?.el?.complete) drawFit(g,W,H,m.el,c,local);
  else if(c.type==='video'&&m?.el&&m.el.readyState>=2) drawFit(g,W,H,m.el,c,local);
  g.filter='none';
  if(c.text) drawTextG(g,W,H,c);
  // per-clip open/close (to black)
  let a=1; const fd=Math.min(0.5,c.duration/2);
  if(c.fadeIn&&local<fd)a=local/fd;
  if(c.fadeOut&&local>c.duration-fd)a=Math.min(a,(c.duration-local)/fd);
  if(a<1){ g.fillStyle='rgba(0,0,0,'+(1-a)+')'; g.fillRect(0,0,W,H); }
  g.restore();
}
function applyTransition(g,W,H,A,B,type,p){
  g.save(); g.globalAlpha=1; g.filter='none';
  switch(type){
    case 'fade': g.drawImage(A,0,0,W,H); g.globalAlpha=p; g.drawImage(B,0,0,W,H); g.globalAlpha=1; break;
    case 'fadeblack':
      if(p<0.5){ g.drawImage(A,0,0,W,H); g.fillStyle='rgba(0,0,0,'+(p*2)+')'; g.fillRect(0,0,W,H); }
      else { g.drawImage(B,0,0,W,H); g.fillStyle='rgba(0,0,0,'+((1-p)*2)+')'; g.fillRect(0,0,W,H); } break;
    case 'slideleft':  g.drawImage(A,-W*p,0,W,H); g.drawImage(B,W*(1-p),0,W,H); break;
    case 'slideright': g.drawImage(A,W*p,0,W,H);  g.drawImage(B,-W*(1-p),0,W,H); break;
    case 'slideup':    g.drawImage(A,0,-H*p,W,H); g.drawImage(B,0,H*(1-p),W,H); break;
    case 'slidedown':  g.drawImage(A,0,H*p,W,H);  g.drawImage(B,0,-H*(1-p),W,H); break;
    case 'wipeleft':   g.drawImage(A,0,0,W,H); g.beginPath(); g.rect(0,0,W*p,H); g.clip(); g.drawImage(B,0,0,W,H); break;
    case 'wiperight':  g.drawImage(A,0,0,W,H); g.beginPath(); g.rect(W*(1-p),0,W*p,H); g.clip(); g.drawImage(B,0,0,W,H); break;
    case 'zoom':       g.drawImage(A,0,0,W,H); { const dw=W*p,dh=H*p; g.globalAlpha=p; g.drawImage(B,(W-dw)/2,(H-dh)/2,dw,dh); } break;
    case 'circle':     g.drawImage(A,0,0,W,H); g.beginPath(); g.arc(W/2,H/2,Math.hypot(W,H)/2*p,0,Math.PI*2); g.clip(); g.drawImage(B,0,0,W,H); break;
    default: g.drawImage(B,0,0,W,H);
  }
  g.restore();
}
function composeFrame(octx,W,H,time){
  octx.globalAlpha=1; octx.filter='none';
  octx.fillStyle='#000'; octx.fillRect(0,0,W,H);
  const info=clipIndexAtTime(time); if(!info) return;
  const c=state.clips[info.i], local=info.local, next=state.clips[info.i+1];
  const tdur=Math.min(c.transDur||0.7, c.duration*0.6);
  const trans=c.transition||'none';
  if(next && trans!=='none' && local>c.duration-tdur){
    const p=(local-(c.duration-tdur))/tdur;
    const A=getBuf('A',W,H), B=getBuf('B',W,H);
    paintClip(A.ctx,W,H,c,local);
    paintClip(B.ctx,W,H,next,0.0001);
    applyTransition(octx,W,H,A.canvas,B.canvas,trans,Math.max(0,Math.min(1,p)));
  } else {
    paintClip(octx,W,H,c,local);
  }
}

function manageVideos(time){
  const live=state.playing||state.exporting;
  const info=clipIndexAtTime(time);
  const activeIds=new Set();
  if(info){
    const c=state.clips[info.i];
    if(c.type==='video') activeIds.add(c.mediaId);
    const next=state.clips[info.i+1];
    if(next){ const tdur=Math.min(c.transDur||0.7,c.duration*0.6);
      if((c.transition||'none')!=='none' && info.local>c.duration-tdur && next.type==='video') activeIds.add(next.mediaId); }
  }
  state.media.forEach(m=>{ if(m.type==='video'&&m.el&&!activeIds.has(m.id)&&!m.el.paused) m.el.pause(); });
  if(info){
    const c=state.clips[info.i];
    if(c.type==='video'){ const m=mediaById(c.mediaId);
      if(m?.el){ const tg=c.trimStart+info.local;
        if(live){ if(m.el.paused) m.el.play().catch(()=>{}); if(Math.abs(m.el.currentTime-tg)>0.35) m.el.currentTime=tg; }
        else { m.el.pause(); if(Math.abs(m.el.currentTime-tg)>0.05) m.el.currentTime=tg; }
      }
    }
  }
}

function renderFrame(){
  if(!state.clips.length){
    ctx.fillStyle='#15161f'; ctx.fillRect(0,0,stage.width,stage.height);
    ctx.fillStyle='#666'; ctx.font='26px Inter,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(t('hintCanvas'), stage.width/2, stage.height/2);
    return;
  }
  manageVideos(state.time);
  composeFrame(ctx,stage.width,stage.height,state.time);
}

// ============================================================
//  PLAYBACK
// ============================================================
$('#playBtn').onclick=()=> state.playing?pause():play();
$('#toStartBtn').onclick=()=>seek(0);
function play(){
  if(!state.clips.length) return;
  if(state.time>=totalDuration()-0.05) state.time=0;
  state.playing=true; $('#playBtn').innerHTML='<i class="fa-solid fa-pause"></i>';
  state._startWall=performance.now(); state._startTime=state.time;
  if(state.audio?.el){ state.audio.el.muted=false; state.audio.el.currentTime=Math.min(state.time,state.audio.el.duration||state.time); state.audio.el.play().catch(()=>{}); }
  loop();
}
function pause(){
  state.playing=false; $('#playBtn').innerHTML='<i class="fa-solid fa-play"></i>';
  cancelAnimationFrame(state._raf);
  state.media.forEach(m=>{ if(m.type==='video'&&m.el&&!m.el.paused) m.el.pause(); });
  if(state.audio?.el) state.audio.el.pause();
}
function loop(){
  if(!state.playing) return;
  state.time=state._startTime+(performance.now()-state._startWall)/1000;
  const total=totalDuration();
  if(state.time>=total){ state.time=total; renderFrame(); updateTimeUI(); pause(); return; }
  renderFrame(); updateTimeUI();
  state._raf=requestAnimationFrame(loop);
}
function seek(time){
  state.time=Math.max(0,Math.min(time,totalDuration()));
  if(state.playing){ state._startWall=performance.now(); state._startTime=state.time; }
  renderFrame(); updateTimeUI();
}
function updateTimeUI(){
  const total=totalDuration();
  $('#timeLabel').textContent=state.time.toFixed(1)+'s / '+total.toFixed(1)+'s';
  $('#scrub').value= total? (state.time/total*1000):0;
}
$('#scrub').oninput=e=>{ seek(totalDuration()*e.target.value/1000); };

// ============================================================
//  ASPECT RATIO
// ============================================================
$('#aspectBtn').onclick=()=>{
  const keys=Object.keys(ASPECTS);
  state.aspect=keys[(keys.indexOf(state.aspect)+1)%keys.length];
  $('#aspectBtn').innerHTML='<i class="fa-solid fa-crop-simple"></i> '+state.aspect;
  applyAspect(); renderFrame();
};
function applyAspect(){
  const [w,h]=ASPECTS[state.aspect];
  stage.width=w; stage.height=h;
  $('#aspectBtn').innerHTML='<i class="fa-solid fa-crop-simple"></i> '+state.aspect;
  const wrap=$('.preview-wrap'); const maxW=wrap.clientWidth-28, maxH=wrap.clientHeight-28;
  const sc=Math.min(maxW/w,maxH/h);
  stage.style.width=(w*sc)+'px'; stage.style.height=(h*sc)+'px';
}
window.addEventListener('resize',()=>{ applyAspect(); renderFrame(); });

// ============================================================
//  NEW PROJECT
// ============================================================
$('#newProjectBtn').onclick=()=>{
  if(state.clips.length && !confirm(t('confirmNew'))) return;
  pause();
  state.media=[]; state.clips=[]; state.audio=null; state.selectedClip=null; state.time=0;
  mediaSeq=0; clipSeq=0;
  renderMedia(); renderTimeline(); renderInspector(); seek(0);
};

// ============================================================
//  SAVE / LOAD PROJECT  (JSON)
// ============================================================
$('#saveProjectBtn').onclick=saveProject;
function saveProject(){
  const data={
    app:'MovieMaker', version:2, savedAt:new Date().toISOString(),
    lang:state.lang, aspect:state.aspect, mediaSeq, clipSeq,
    media: state.media.map(m=>({
      id:m.id, type:m.type, name:m.name, mime:m.mime||'', duration:m.duration||0, mediaDur:m.mediaDur||0,
      base64: (m.type==='image'||m.type==='video') ? m.dataUrl : undefined,
      audio:  (m.type==='audio') ? Array.from(m.bytes||[]) : undefined,
    })),
    clips: state.clips.map(c=>({
      id:c.id, type:c.type, mediaId:c.mediaId, duration:c.duration, trimStart:c.trimStart,
      text:c.text, textColor:c.textColor, textPos:c.textPos, fontSize:c.fontSize, bgColor:c.bgColor,
      fit:c.fit, filter:c.filter, fadeIn:c.fadeIn, fadeOut:c.fadeOut, kenBurns:c.kenBurns,
      transition:c.transition, transDur:c.transDur,
    })),
    audio: state.audio ? { mediaId:state.audio.mediaId, volume:state.audio.volume } : null,
  };
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`movie_project_${Date.now()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(t('saved'));
}

$('#loadProjectBtn').onclick=()=>$('#loadInput').click();
$('#loadInput').onchange=async e=>{ const f=e.target.files[0]; if(f) await loadProject(f); e.target.value=''; };
async function loadProject(file){
  try{
    const data=JSON.parse(await file.text());
    if(!data || data.app!=='MovieMaker') throw new Error('format');
    pause();
    state.media=[]; state.clips=[]; state.audio=null; state.selectedClip=null; state.time=0;
    state.lang=data.lang||state.lang; state.aspect=data.aspect||'16:9';
    mediaSeq=data.mediaSeq||0; clipSeq=data.clipSeq||0;
    for(const md of (data.media||[])){
      const m={ id:md.id, type:md.type, name:md.name, mime:md.mime, duration:md.duration, mediaDur:md.mediaDur, el:null };
      if(md.type==='image'||md.type==='video'){ m.dataUrl=md.base64; m.url=md.base64; buildMediaElement(m); }
      else if(md.type==='audio'){
        const bytes=new Uint8Array(md.audio||[]); m.bytes=bytes;
        const blob=new Blob([bytes],{type:md.mime||'audio/mpeg'}); m.url=URL.createObjectURL(blob); buildMediaElement(m);
      }
      state.media.push(m);
    }
    state.clips=(data.clips||[]).map(c=>({ transition:'none', transDur:0.7, ...c }));
    if(data.audio){ const am=mediaById(data.audio.mediaId); state.audio={ mediaId:data.audio.mediaId, volume:data.audio.volume??1, el:am?am.el:null }; }
    localStorage.setItem('mm_lang',state.lang);
    buildLangSelectValue();
    applyAspect(); applyLang(); switchTab('images'); seek(0);
    toast(t('loaded'));
  }catch(err){ console.error(err); toast(t('loadErr')); }
}

// ============================================================
//  EXPORT (WebM / MP4)
// ============================================================
const exportModal=$('#exportModal');
let exportFmt='webm', recorder=null, recChunks=[], exportStopFlag=false;
let expActx=null, expDest=null;

$('#exportBtn').onclick=()=>{ if(!state.clips.length){ toast(t('addFirst')); return; } showExportSetup(); exportModal.classList.add('show'); };
$('#exportCancel').onclick=()=>exportModal.classList.remove('show');
$('#exportClose').onclick=()=>exportModal.classList.remove('show');
$('#formatSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  $('#formatSeg').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); exportFmt=b.dataset.fmt; updateFmtNote();
});
function pickMime(fmt){
  const cands=fmt==='mp4'
    ?['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1','video/mp4']
    :['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(const c of cands){ if(MediaRecorder.isTypeSupported(c)) return c; }
  return null;
}
function updateFmtNote(){
  const note=$('#fmtNote'); if(!note) return;
  if(exportFmt==='mp4'){ note.innerHTML = pickMime('mp4')? t('noteMp4Ok') : t('noteMp4No'); }
  else note.innerHTML=t('noteWebm');
}
function showExportSetup(){
  $('#exportSetup').style.display=''; $('#exportProgress').style.display='none'; $('#exportDone').style.display='none';
  updateFmtNote();
}
$('#exportStart').onclick=startExport;
$('#exportStop').onclick=()=>{ exportStopFlag=true; };

function exportAudioTracks(){
  if(!expActx){ try{ expActx=new (window.AudioContext||window.webkitAudioContext)(); expDest=expActx.createMediaStreamDestination(); }catch(_){ return []; } }
  let has=false;
  const wire=el=>{ if(!el) return; if(el._wired){ has=true; el.muted=false; return; }
    try{ const s=expActx.createMediaElementSource(el); s.connect(expDest); s.connect(expActx.destination); el._wired=true; el.muted=false; has=true; }catch(_){ } };
  if(state.audio?.el) wire(state.audio.el);
  state.clips.forEach(c=>{ if(c.type==='video'){ const m=mediaById(c.mediaId); if(m?.el) wire(m.el); } });
  return has? expDest.stream.getAudioTracks():[];
}

async function startExport(){
  pause();
  const [rw,rh]=$('#resSelect').value.split('x').map(Number);
  const bitrate=+$('#qualitySelect').value;
  const canvas=document.createElement('canvas'); canvas.width=rw; canvas.height=rh;
  const ec=canvas.getContext('2d');

  const audioTracks=exportAudioTracks();
  if(expActx && expActx.state==='suspended'){ try{ await expActx.resume(); }catch(_){} }

  const vstream=canvas.captureStream(30);
  const stream=new MediaStream([...vstream.getVideoTracks(),...audioTracks]);
  const mime=pickMime(exportFmt)||pickMime('webm')||'video/webm';
  const actualIsMp4=mime.startsWith('video/mp4');
  try{ recorder=new MediaRecorder(stream,{ mimeType:mime, videoBitsPerSecond:bitrate }); }
  catch(_){ recorder=new MediaRecorder(stream); }
  recChunks=[]; recorder.ondataavailable=e=>{ if(e.data.size) recChunks.push(e.data); };

  $('#exportSetup').style.display='none'; $('#exportProgress').style.display='';
  $('#progText').textContent=t('preparing');
  exportStopFlag=false; state.exporting=true;

  const total=totalDuration();
  recorder.start(100);
  if(state.audio?.el){ try{ state.audio.el.currentTime=0; state.audio.el.muted=false; await state.audio.el.play(); }catch(_){} }

  const startWall=performance.now();
  await new Promise(resolve=>{
    function step(){
      const tt=(performance.now()-startWall)/1000;
      if(tt>=total||exportStopFlag){ resolve(); return; }
      state.time=tt; manageVideos(tt); composeFrame(ec,canvas.width,canvas.height,tt);
      $('#progFill').style.width=Math.min(100,tt/total*100)+'%';
      $('#progText').textContent=`${t('processing')}: ${tt.toFixed(1)}s / ${total.toFixed(1)}s`;
      requestAnimationFrame(step);
    }
    step();
  });

  recorder.stop();
  state.exporting=false;
  state.media.forEach(m=>{ if(m.el&&m.el.pause) m.el.pause(); });
  if(state.audio?.el) state.audio.el.pause();
  await new Promise(res=>recorder.onstop=res);

  const blob=new Blob(recChunks,{type:mime});
  const url=URL.createObjectURL(blob);
  const link=$('#downloadLink');
  link.href=url; link.download=`movie_${Date.now()}.${exportFmt==='mp4'?'mp4':'webm'}`;
  $('#exportProgress').style.display='none'; $('#exportDone').style.display='';
  const sizeMB=(blob.size/1048576).toFixed(1);
  let info=`${t('infoDur')}: ${total.toFixed(1)}s • ${t('infoSize')}: ${sizeMB} MB • ${$('#resSelect').value}`;
  if(exportFmt==='mp4' && !actualIsMp4) info+=`<br><span style="color:var(--warn)">${t('mp4Fallback')}</span>`;
  $('#doneInfo').innerHTML=info;
  seek(0); toast(t('videoReady'));
}

// ============================================================
//  HELPERS / INIT
// ============================================================
let toastT=null;
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2200); }

window.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')) return;
  if(e.code==='Space'){ e.preventDefault(); state.playing?pause():play(); }
  if(e.code==='Delete'&&state.selectedClip) deleteClip(state.selectedClip);
});

buildLangSelect();
applyAspect();
applyLang();
</script>
